
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>PERCIA IPTV</title>

<style>
:root {
  --bg:#101010;
  --panel:#191919;
  --gold:#c9aa68;
  --text:#f5f2eb;
  --line:#353535;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header {
  background:#151515;
  padding:11px 17px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:10;
}

.logo {
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
}

.logo span {
  color:var(--gold);
}

.container {
  width:100%;
  max-width:850px;
  margin:auto;
  padding:7px;
}

.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px;
  margin-bottom:8px;
}

label {
  display:block;
  color:#ccc;
  font-size:12px;
  margin:6px 0 4px;
}

label[for="profileName"],
label[for="server"],
label[for="username"],
label[for="password"] {
  display:none;
}

input,textarea {
  width:100%;
  background:#101010;
  color:white;
  border:1px solid #393939;
  border-radius:7px;
  padding:9px;
  font-size:13px;
  outline:none;
}

input:focus,textarea:focus {
  border-color:var(--gold);
}

#profileName,
#server,
#username {
  margin-top:5px;
}

textarea {
  height:43px;
  min-height:43px;
  resize:vertical;
}

button {
  border:0;
  border-radius:7px;
  padding:9px;
  background:var(--gold);
  color:#17130c;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled {
  opacity:.55;
}

.full {
  width:100%;
  margin-top:6px;
}

.secondary {
  background:#292929;
  color:#eee;
  border:1px solid #414141;
}

.danger {
  background:#382020;
  color:#ffbcbc;
}

.divider {
  height:1px;
  background:#383838;
  margin:8px 0;
}

.message {
  display:none;
  margin-top:8px;
  padding:9px;
  border-radius:8px;
  font-size:12px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.message.show {
  display:block;
}

.message.error {
  background:#351d1d;
  color:#ffb4b4;
}

.message.success {
  background:#1c3024;
  color:#b9edc8;
}

.message.info {
  background:#29251d;
  color:#e4d1a2;
}

.profile {
  background:#101010;
  border:1px solid #393939;
  border-radius:9px;
  padding:8px;
  margin-top:6px;
}

.profile-name {
  font-size:13px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.profile-actions {
  display:flex;
  gap:5px;
  margin-top:7px;
}

.profile-actions button {
  flex:1;
  padding:8px 2px;
  font-size:9px;
}

.empty {
  color:#888;
  text-align:center;
  padding:8px 3px;
  font-size:12px;
}

#catalogScreen {
  display:none;
}

.catalog-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
}

.catalog-header h2 {
  font-size:19px;
}

.catalog-count {
  color:var(--gold);
  font-size:12px;
}

.category-list {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 0;
}

.category-chip {
  white-space:nowrap;
  background:#292929;
  color:#ddd;
  border:1px solid #444;
  border-radius:20px;
  padding:9px 13px;
  margin:0;
  font-size:11px;
}

.category-chip.active {
  background:var(--gold);
  color:#17130c;
}

.movie-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.movie-card {
  background:#191919;
  border:1px solid #303030;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
}

.poster,.poster-placeholder {
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#252525;
}

.poster-placeholder {
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
  font-size:25px;
}

.movie-name {
  padding:8px;
  font-size:11px;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.movie-detail {
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(0,0,0,.9);
  padding:15px;
  overflow:auto;
  align-items:center;
  justify-content:center;
}

.detail-box {
  width:100%;
  max-width:400px;
  background:#1b1b1b;
  border:1px solid #51452f;
  border-radius:12px;
  padding:15px;
}

.detail-box img {
  display:block;
  width:120px;
  max-height:180px;
  object-fit:cover;
  margin:0 auto 12px;
}

.detail-box h3 {
  text-align:center;
  margin-bottom:10px;
}

.detail-box p {
  color:#aaa;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:360px) {
  .movie-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(min-width:650px) {
  .movie-grid {
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

/* Reproductor exclusivo de Películas */
#moviePlayerScreen {
  display:none;
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  z-index:9999;
  background:#000;
  color:#fff;
  overflow:hidden;
}
#moviePlayerScreen.active { display:flex; }
#movieVideo {
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}
#moviePlayerScreen:fullscreen {
  width:100%;
  height:100%;
  background:#000;
}
#moviePlayerScreen:-webkit-full-screen {
  width:100%;
  height:100%;
  background:#000;
}
.player-topbar {
  opacity:1;
  transition:opacity .25s ease;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background:linear-gradient(#000b,transparent);
  pointer-events:none;
}
.player-topbar button { pointer-events:auto; }
#moviePlayerScreen.controls-hidden .player-topbar { opacity:0; pointer-events:none; }
#moviePlayerScreen.controls-hidden .player-topbar button { pointer-events:none; }
.player-title {
  max-width:75%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  text-shadow:0 1px 4px #000;
}
#closeMoviePlayer {
  width:40px;
  height:40px;
  border-radius:50%;
  padding:0;
  background:#242424dd;
  border:1px solid #ffffff40;
  color:#fff;
  font-size:25px;
}
#moviePlayerMessage {
  position:absolute;
  left:12px;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 70px);
  z-index:3;
  color:#fff;
  background:#261b1bdf;
  border:1px solid #754444;
  border-radius:8px;
  padding:10px;
  font-size:12px;
  display:none;
}
#moviePlayerMessage.show { display:block; }


/* TV EN VIVO: estilos aislados; no alteran el catálogo de Películas */
#liveScreen .movie-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
.live-channel-card { background:#191919;border:1px solid #303030;border-radius:8px;overflow:hidden;min-width:0;cursor:pointer;text-align:center;padding:8px;color:#f5f2eb; }
.live-channel-logo { width:100%;height:76px;object-fit:contain;background:#101010;border-radius:5px;padding:7px; }
.live-channel-placeholder { height:76px;display:grid;place-items:center;background:#101010;color:#c9aa68;font-size:25px;border-radius:5px; }
.live-channel-name { display:block;font-size:11px;line-height:1.3;margin-top:7px;overflow-wrap:anywhere; }
#livePlayerScreen { display:none;position:fixed;inset:0;background:#000;z-index:10000;align-items:center;justify-content:center; }
#livePlayerScreen.active { display:flex; }
#liveVideo { width:100%;height:100%;object-fit:contain;background:#000; }
.live-player-topbar { position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 15px 12px;background:linear-gradient(#000c,transparent);transition:opacity .25s; }
.live-player-topbar.hidden { opacity:0;pointer-events:none; }
#livePlayerTitle { color:white;font-size:14px;font-weight:bold;text-shadow:0 1px 4px #000; }
/* Botón de regreso permanente: no se oculta con los controles del reproductor */
#backLivePlayer {
  position:absolute;
  z-index:10002;
  top:calc(env(safe-area-inset-top) + 12px);
  left:14px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:1px solid #ffffff66;
  background:#171717e8;
  color:#fff;
  font-size:29px;
  line-height:1;
  padding:0;
  box-shadow:0 2px 10px #0008;
  opacity:1;
  visibility:visible;
  transition:opacity .2s ease, visibility .2s ease;
}
#backLivePlayer.hidden {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#livePlayerTopbar { padding-left:70px; }

#closeLivePlayer { width:40px;height:40px;border-radius:50%;background:#242424dd;border:1px solid #ffffff40;color:white;font-size:25px; }
#livePlayerMessage { position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 65px);display:none;background:#261b1bdf;color:#fff;padding:10px;border-radius:8px;font-size:12px; }
#livePlayerMessage.show { display:block; }
@media(min-width:600px){#liveScreen .movie-grid{grid-template-columns:repeat(4,minmax(0,1fr));}.live-channel-logo,.live-channel-placeholder{height:100px;}}



/* SERIES: tarjetas compactas y navegación propia */
#seriesScreen .movie-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }

/* SERIES: cinco posters en horizontal; dos en vertical */
@media (orientation: landscape) and (min-width: 600px) {
  #seriesScreen .movie-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }
}
@media (orientation: portrait) {
  #seriesScreen .movie-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
#seriesScreen .movie-card { min-width:0; }
#seriesScreen .series-poster { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; background:#222; }
#seriesScreen .series-name { padding:8px; font-size:13px; line-height:1.3; overflow-wrap:anywhere; min-height:48px; }
#seriesScreen .series-meta { padding:0 8px 8px; color:#c9aa68; font-size:11px; }
#seriesScreen .series-detail-panel { margin:10px 0; padding:12px; background:#1b1b1b; border:1px solid #444; border-radius:10px; }
#seriesScreen .series-season-row { display:flex; gap:8px; overflow-x:auto; padding:8px 0; }
#seriesScreen .series-season-row button { flex:0 0 auto; }
#seriesScreen .series-episode { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #333; }
#seriesScreen .series-episode-info { flex:1; min-width:0; }
#seriesScreen .series-episode-info strong { display:block; font-size:13px; }
#seriesScreen .series-episode-info small { color:#aaa; }
#seriesPlayer { display:none; position:fixed; inset:0; z-index:10010; background:#000; color:white; }
#seriesPlayer.active { display:flex; align-items:center; justify-content:center; }
#seriesPlayer video { width:100%; height:100%; object-fit:contain; background:#000; }
#seriesPlayerClose { position:absolute; z-index:5; top:calc(env(safe-area-inset-top) + 12px); left:12px; border-radius:50%; width:52px; height:52px; background:#222d; color:white; border:1px solid #777; font-size:30px; opacity:1; transition:opacity .2s ease; }
#seriesPlayerTitle { position:absolute; z-index:5; top:calc(env(safe-area-inset-top) + 20px); left:76px; right:12px; color:#fff; font-size:clamp(16px,3vw,28px); font-weight:bold; text-shadow:0 1px 4px #000; opacity:1; transition:opacity .2s ease; pointer-events:none; }
#seriesPlayer.series-ui-hidden #seriesPlayerClose,
#seriesPlayer.series-ui-hidden #seriesPlayerTitle { opacity:0; pointer-events:none; }


.favorite-card-wrap{position:relative;min-width:0}
.favorite-toggle{position:absolute;top:7px;right:7px;z-index:3;width:34px;height:34px;padding:0;border-radius:50%;background:#111d;color:#fff;border:1px solid #ffffff55;font-size:18px;line-height:1}
.favorite-toggle.is-favorite{color:#e7b9b9;background:#261313;border-color:#b86b6b}
#favoritesScreen .favorite-card-wrap{cursor:pointer}
</style>
</head>

<body>

<header>
  <div class="logo">PERCIA <span>IPTV</span></div>
</header>

<main class="container">

<section id="connectionScreen">

  <div class="card">
    <form id="profileForm">

      <label for="fullUrl">Pegar URL</label>
      <textarea id="fullUrl" placeholder="URL completa"></textarea>

      <button type="button" class="secondary full" id="extractButton">
        EXTRAER URL
      </button>

      <div id="urlMessage" class="message"></div>

      <div class="divider"></div>

      <label for="profileName">Nombre</label>
      <input id="profileName" placeholder="Nombre del perfil" required>

      <label for="server">Servidor</label>
      <input id="server" type="url" placeholder="http://servidor.com:8080" required>

      <label for="username">Usuario</label>
      <input id="username" placeholder="Usuario" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" required>

      <button type="submit" class="full" id="connectButton">
        CONECTAR
      </button>

      <button type="button" class="secondary full" id="clearButton">
        LIMPIAR
      </button>

      <div id="connectionMessage" class="message"></div>

    </form>
  </div>

  <div class="card">
    <div id="profilesList"></div>
  </div>

</section>

<section id="catalogScreen">

  <button class="secondary full" id="backButton">← VOLVER</button>
  <button class="full" id="openLiveButton" style="margin-top:8px">📺 TV EN VIVO</button>
  <button class="secondary full" id="openSeriesButton" style="margin-top:8px">🎬 SERIES</button>
  <button class="secondary full" id="openFavoritesButton" style="margin-top:8px">♥ FAVORITOS</button>

  <div class="catalog-header">
    <h2>Películas</h2>
    <span class="catalog-count" id="movieCount">0 películas</span>
  </div>

  <input id="movieSearch" placeholder="Buscar película...">

  <div class="category-list" id="categoryList"></div>

  <div id="catalogMessage" class="message"></div>

  <div class="movie-grid" id="movieGrid"></div>

  <button class="secondary full" id="loadMoreButton" style="display:none">
    CARGAR MÁS
  </button>

</section>

<section id="favoritesScreen" style="display:none">
  <button class="secondary full" id="favoritesBackButton">← VOLVER AL CATÁLOGO</button>
  <div class="catalog-header"><h2>FAVORITOS</h2><span class="catalog-count" id="favoritesCount">0 elementos</span></div>
  <div class="category-list" id="favoritesFilters">
    <button class="category-chip active" data-fav-filter="all">Todos</button>
    <button class="category-chip" data-fav-filter="movie">Películas</button>
    <button class="category-chip" data-fav-filter="series">Series</button>
    <button class="category-chip" data-fav-filter="live">TV en vivo</button>
  </div>
  <div class="movie-grid" id="favoritesGrid"></div>
  <div id="favoritesEmpty" class="empty" style="display:none">Todavía no tienes favoritos. Pulsa ♥ en una película, serie o canal.</div>
</section>

<section id="liveScreen" style="display:none">
  <button class="secondary full" id="liveBackButton">← VOLVER A PELÍCULAS</button>
  <div class="catalog-header">
    <h2>TV EN VIVO</h2>
    <span class="catalog-count" id="liveCount">0 canales</span>
  </div>
  <input id="liveSearch" placeholder="Buscar canal..." autocomplete="off">
  <div class="category-list" id="liveCategoryList"></div>
  <div id="liveMessage" class="message"></div>
  <div class="movie-grid" id="liveGrid"></div>
</section>

<!-- MÓDULO SERIES: independiente de Películas y TV EN VIVO -->
<section id="seriesScreen" style="display:none">
  <button class="secondary full" id="seriesBackButton">← VOLVER A PELÍCULAS</button>
  <div class="catalog-header">
    <h2>SERIES</h2>
    <span class="catalog-count" id="seriesCount">0 series</span>
  </div>
  <input id="seriesSearch" placeholder="Buscar serie..." autocomplete="off">
  <div class="category-list" id="seriesCategoryList"></div>
  <div id="seriesMessage" class="message"></div>
  <div class="movie-grid" id="seriesGrid"></div>
  <button class="secondary full" id="seriesLoadMoreButton" style="display:none">CARGAR MÁS</button>
  <div id="seriesDetail" style="display:none">
    <button class="secondary full" id="seriesDetailBack">← VOLVER A SERIES</button>
    <div id="seriesDetailContent" class="series-detail-panel"></div>
    <div id="seriesSeasonButtons" class="series-season-row"></div>
    <div id="seriesEpisodes"></div>
  </div>
</section>
</main>

<div id="seriesPlayer" aria-label="Reproductor de episodios">
  <video id="seriesVideo" controls playsinline webkit-playsinline preload="metadata"></video>
  <button id="seriesPlayerClose" type="button">←</button>
  <div id="seriesPlayerTitle"></div>
</div>

<div id="livePlayerScreen" aria-label="Reproductor de TV en vivo">
  <video id="liveVideo" controls playsinline webkit-playsinline preload="metadata"></video>
  <button id="backLivePlayer" type="button" aria-label="Volver a canales">←</button>
  <div class="live-player-topbar" id="livePlayerTopbar">
    <div id="livePlayerTitle">TV EN VIVO</div>
    <button id="closeLivePlayer" type="button" aria-label="Cerrar reproductor">×</button>
  </div>
  <div id="livePlayerMessage"></div>
</div>

<div class="movie-detail" id="movieDetail">
  <div class="detail-box">
    <img id="detailPoster" src="" alt="">
    <h3 id="detailTitle"></h3>
    <p id="detailDescription"></p>
    <button class="full" id="prepareMovieButton">REPRODUCIR</button>
    <button class="secondary full" id="closeDetail">CERRAR</button>
  </div>
</div>


<div id="moviePlayerScreen" aria-label="Reproductor de películas">
  <video id="movieVideo" controls playsinline webkit-playsinline preload="metadata"></video>
  <div class="player-topbar">
    <div id="moviePlayerTitle" class="player-title">PERCIA IPTV</div>
    <button id="closeMoviePlayer" type="button" aria-label="Cerrar reproductor">×</button>
  </div>
  <div id="moviePlayerMessage"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<script>
const STORAGE_KEY = 'percia_iptv_profiles_v1';
const $ = id => document.getElementById(id);

let profiles = [];
let editingId = null;
let activeProfile = null;
let allMovies = [];
let filteredMovies = [];
let visibleMovies = 30;
let selectedMovie = null;
let movieHls = null;
let currentMovieUrl = '';

function message(id,text,type) {
  $(id).textContent = text;
  $(id).className = 'message show ' + type;
}

function hideMessage(id) {
  $(id).textContent = '';
  $(id).className = 'message';
}

function loadProfiles() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    profiles = Array.isArray(data) ? data : [];
  } catch {
    profiles = [];
  }
  renderProfiles();
}

function saveProfiles() {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(profiles));
  renderProfiles();
}

function extractUrl() {
  try {
    const parsed = new URL($('fullUrl').value.trim());
    const username = parsed.searchParams.get('username');
    const password = parsed.searchParams.get('password');

    if (!username || !password) {
      throw new Error('URL Xtream no válida');
    }

    $('server').value = parsed.origin;
    $('username').value = username;
    $('password').value = password;

    if (!$('profileName').value.trim()) {
      $('profileName').value = 'Mi IPTV';
    }

    message('urlMessage','Datos extraídos.','success');

  } catch(error) {
    message('urlMessage',error.message || 'URL no válida.','error');
  }
}

$('extractButton').addEventListener('click',extractUrl);

function clearForm() {
  $('profileForm').reset();
  editingId = null;
  $('connectButton').textContent = 'CONECTAR';
  hideMessage('urlMessage');
  hideMessage('connectionMessage');
}

$('clearButton').addEventListener('click',clearForm);

function normalizeServer(value) {
  return value.trim().replace(/\/+$/,'');
}

function apiUrl(profile,extra={}) {
  const url = new URL('/player_api.php',profile.server);
  url.searchParams.set('username',profile.username);
  url.searchParams.set('password',profile.password);

  Object.entries(extra).forEach(([key,value]) => {
    if (value !== null && value !== undefined) {
      url.searchParams.set(key,value);
    }
  });

  return url;
}

async function fetchJson(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(),20000);

  try {
    const response = await fetch(url.toString(),{
      method:'GET',
      signal:controller.signal
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    return await response.json();
  } finally {
    clearTimeout(timeout);
  }
}

$('profileForm').addEventListener('submit',async event => {
  event.preventDefault();

  const name = $('profileName').value.trim();
  const server = normalizeServer($('server').value);
  const username = $('username').value.trim();
  const password = $('password').value;

  if (!name || !server || !username || !password) {
    message('connectionMessage','Completa todos los campos.','error');
    return;
  }

  try {
    const parsed = new URL(server);
    if (!['http:','https:'].includes(parsed.protocol)) throw new Error();
  } catch {
    message('connectionMessage','Servidor no válido.','error');
    return;
  }

  await connectProfile({
    id:editingId || Date.now().toString(),
    name,
    server,
    username,
    password
  });
});

async function connectProfile(profile) {
  const button = $('connectButton');
  button.disabled = true;
  button.textContent = 'CONECTANDO...';

  message('connectionMessage','Conectando...','info');

  try {
    const data = await fetchJson(apiUrl(profile));

    if (!data || !data.user_info || Number(data.user_info.auth) !== 1) {
      throw new Error('Credenciales incorrectas.');
    }

    const index = profiles.findIndex(p => p.id === profile.id);

    if (index >= 0) profiles[index] = profile;
    else profiles.push(profile);

    saveProfiles();

    activeProfile = profile;
    editingId = null;

    await openCatalog();

  } catch(error) {
    let detail = error.message;

    if (error.name === 'AbortError') detail = 'Tiempo de espera agotado.';
    if (error instanceof TypeError) detail = 'No se pudo acceder al servidor. Posible error de CORS o conexión.';

    message('connectionMessage',detail,'error');

  } finally {
    button.disabled = false;
    button.textContent = 'CONECTAR';
  }
}

function editProfile(id) {
  const p = profiles.find(item => item.id === id);
  if (!p) return;

  editingId = id;
  $('profileName').value = p.name;
  $('server').value = p.server;
  $('username').value = p.username;
  $('password').value = p.password;
  $('fullUrl').value = '';
  $('connectButton').textContent = 'ACTUALIZAR Y CONECTAR';

}

function deleteProfile(id) {
  const p = profiles.find(item => item.id === id);
  if (!p || !confirm('¿Eliminar este perfil?')) return;

  profiles = profiles.filter(item => item.id !== id);
  saveProfiles();

  if (editingId === id) clearForm();
}

function buildMovieUrl(movie) {
  if (movie.direct_source) return movie.direct_source;
  if (movie.stream_url) return movie.stream_url;
  if (!activeProfile || !movie.stream_id) {
    throw new Error('No se encontró el identificador de reproducción de esta película.');
  }
  const extension = String(movie.container_extension || 'mp4').replace(/[^a-z0-9]/gi,'') || 'mp4';
  return activeProfile.server.replace(/\/+$/,'') + '/movie/' +
    encodeURIComponent(activeProfile.username) + '/' +
    encodeURIComponent(activeProfile.password) + '/' +
    encodeURIComponent(movie.stream_id) + '.' + extension;
}

async function openMoviePlayer(movie) {
  const screen = $('moviePlayerScreen');
  const video = $('movieVideo');
  $('moviePlayerTitle').textContent = movie.name || 'PERCIA IPTV';
  showMovieControls();
  $('movieDetail').style.display = 'none';
  clearPlayerMessage();
  stopMoviePlayback();

  try {
    currentMovieUrl = buildMovieUrl(movie);
  } catch (error) {
    screen.classList.add('active');
    showPlayerMessage(error.message);
    return;
  }

  screen.classList.add('active');

  // Solicitar pantalla completa desde el toque del usuario.
  // En Android Chrome esto activa el modo de pantalla completa del navegador.
  let fullscreenPromise = null;
  if (screen.requestFullscreen) {
    try { fullscreenPromise = screen.requestFullscreen({navigationUI:'hide'}); }
    catch (_) { fullscreenPromise = null; }
  }

  const isHls = /\.m3u8($|\?)/i.test(currentMovieUrl);
  if (isHls && window.Hls && Hls.isSupported()) {
    movieHls = new Hls({enableWorker:true});
    movieHls.loadSource(currentMovieUrl);
    movieHls.attachMedia(video);
    movieHls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) showPlayerMessage('No se pudo reproducir. Comprueba el acceso al servidor y el formato del vídeo.');
    });
  } else {
    video.src = currentMovieUrl;
  }

  if (fullscreenPromise && typeof fullscreenPromise.catch === 'function') {
    fullscreenPromise.catch(() => {
      // El reproductor permanece en pantalla completa visual aunque el navegador
      // no permita el modo fullscreen nativo.
    });
  }
  video.play().catch(() => {
    showPlayerMessage('Pulsa ▶ en los controles para iniciar la película. Si no reproduce, el formato puede no ser compatible con el navegador.');
  });
}
async function closeMoviePlayer() {
  if (movieControlsTimer) clearTimeout(movieControlsTimer);
  movieControlsTimer = null;
  stopMoviePlayback();
  $('moviePlayerScreen').classList.remove('active','controls-hidden');
  if (document.fullscreenElement && document.exitFullscreen) {
    try { await document.exitFullscreen(); } catch (_) {}
  }
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  } catch (_) {}
}

function liveStreamUrl(ch) {

  // No usar container_extension='ts' con Hls.js: Hls.js necesita un manifiesto .m3u8.

async function playLiveChannel(ch) {
  stopLivePlayback();
  $('livePlayerTitle').textContent=ch.name||'TV EN VIVO';
  $('livePlayerMessage').classList.remove('show');
  $('livePlayerMessage').textContent='Conectando al canal...';
  livePlayerScreen.classList.add('active');
  showLiveControls();
  const url=liveStreamUrl(ch);
  liveVideo.onerror=()=>showLivePlayerError('No se pudo abrir el flujo HLS. Verifica que tu servidor Xtream permita enlaces .m3u8 y que el canal esté activo.');
  if(window.Hls && Hls.isSupported()){
    liveHls=new Hls({enableWorker:true, lowLatencyMode:true, backBufferLength:30});
    liveHls.on(Hls.Events.ERROR,(_,data)=>{
      if(data.fatal){
        const detail=data.details || data.type || 'error desconocido';
        showLivePlayerError('Error HLS: '+detail+'. El servidor debe permitir reproducción HLS (.m3u8).');
        liveHls.destroy(); liveHls=null;
      }
    });
    liveHls.on(Hls.Events.MANIFEST_PARSED,()=>{
      $('livePlayerMessage').classList.remove('show');
      liveVideo.play().catch(()=>showLivePlayerError('Pulsa reproducir para iniciar el canal.'));
    });
    liveHls.loadSource(url);
    liveHls.attachMedia(liveVideo);
  } else if(liveVideo.canPlayType('application/vnd.apple.mpegurl')) {
    liveVideo.src=url;
    liveVideo.play().catch(()=>showLivePlayerError('El teléfono no pudo iniciar el flujo HLS.'));
  } else {
    showLivePlayerError('Este WebView no admite HLS. Actualiza Android System WebView o Chrome.');
  }
}

const PerciaFavorites = (() => {
  const KEY='percia_iptv_favorites_v1';
  let items=[];
  try { items=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(items)) items=[]; } catch(_) { items=[]; }
  const keyOf=(type,item)=>type+':'+String(item.stream_id||item.series_id||item.id||item.num||item.name||'');
  const has=(type,item)=>items.some(x=>x.key===keyOf(type,item));
  function toggle(type,item){
    const key=keyOf(type,item);
    if(has(type,item)) items=items.filter(x=>x.key!==key);
    else items.push({key,type,item:{...item}});
    try{localStorage.setItem(KEY,JSON.stringify(items));}catch(_){}
    document.dispatchEvent(new CustomEvent('percia:favorites-changed'));
    return has(type,item);
  }
  function button(type,item){
    const b=document.createElement('button');b.type='button';
    const update=()=>{const active=has(type,item);b.className='favorite-toggle'+(active?' is-favorite':'');b.textContent=active?'♥':'♡';b.title=active?'Quitar de favoritos':'Agregar a favoritos';};
    update();b.addEventListener('click',e=>{e.stopPropagation();toggle(type,item);update();});
    return b;
  }
  return {has,toggle,button,all:()=>items.slice()};
})();

      const wrap=document.createElement('div');wrap.className='favorite-card-wrap';wrap.append(card,PerciaFavorites.button('series',item));grid.appendChild(wrap);
    });
    el('seriesCount').textContent=state.filtered.length+' series';
    el('seriesLoadMoreButton').style.display=state.visible<state.filtered.length?'block':'none';
    if(!state.filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No hay series para mostrar.';grid.appendChild(empty);}
  }
  async function loadCatalog(category='all') {
    msg('Cargando series...'); el('seriesGrid').replaceChildren();
    try {
      const args={action:'get_series'};
      if(String(category)!=='all') args.category_id=category;
      const data=await fetchJson(apiUrl(activeProfile,args));
      if(!Array.isArray(data)) throw new Error('Respuesta de catálogo no válida.');
      state.all=data; filter(); msg(data.length?'Catálogo de series cargado.':'No hay series en esta categoría.',data.length?'success':'info');
    } catch(e){msg('Error al cargar series: '+(e.message||'verifica el servidor'),'error');}
  }
  async function openSeries() {
    if(!activeProfile){msg('Primero conecta un perfil Xtream.','error');return;}
    el('catalogScreen').style.display='none'; el('liveScreen').style.display='none'; el('connectionScreen').style.display='none'; el('seriesScreen').style.display='block';
    el('seriesGrid').style.display='grid'; el('seriesDetail').style.display='none'; el('seriesSearch').value='';
    state.category='all'; msg('Cargando categorías...');
    try {
      const cats=await fetchJson(apiUrl(activeProfile,{action:'get_series_categories'}));
      if(!Array.isArray(cats)) throw new Error('Respuesta de categorías no válida.');
      state.categories=cats; renderCategories(); await loadCatalog('all');
    } catch(e){msg('No se pudieron cargar las categorías: '+(e.message||''),'error');}
    window.scrollTo(0,0);
  }
  async function openSeriesDetails(item) {
    msg('Cargando temporadas y episodios...');
    try {
      const data=await fetchJson(apiUrl(activeProfile,{action:'get_series_info',series_id:item.series_id}));
      if(!data || !data.episodes) throw new Error('El servidor no devolvió temporadas o episodios.');
      state.info={item,data};
      el('seriesGrid').style.display='none'; el('seriesCategoryList').style.display='none'; el('seriesSearch').style.display='none'; el('seriesLoadMoreButton').style.display='none'; el('seriesCount').textContent=item.name||'Serie';
      el('seriesDetail').style.display='block'; el('seriesMessage').className='message';
      const info=el('seriesDetailContent'); info.replaceChildren();
      const title=document.createElement('h3'); title.textContent=item.name||'Serie';
      const desc=document.createElement('p'); desc.textContent=(data.info&&data.info.plot)||item.plot||item.name||'Selecciona una temporada y un episodio.';
      info.append(title,desc);
      const seasons=Object.keys(data.episodes);
      const buttons=el('seriesSeasonButtons'); buttons.replaceChildren();
      seasons.forEach((season,i)=>{
        const b=document.createElement('button'); b.className='category-chip'+(i===0?' active':''); b.textContent='Temporada '+season;
        b.addEventListener('click',()=>{buttons.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEpisodes(season);});
        buttons.appendChild(b);
      });
      if(seasons.length) renderEpisodes(seasons[0]);
      else el('seriesEpisodes').textContent='Esta serie no tiene episodios disponibles.';
    } catch(e){msg('No se pudieron cargar las temporadas: '+(e.message||'error del servidor'),'error');}
  }
  function renderEpisodes(season) {
    const list=el('seriesEpisodes'); list.replaceChildren();
    const episodes=state.info.data.episodes[season]||[];
    episodes.forEach((ep,i)=>{
      const row=document.createElement('div'); row.className='series-episode';
      if(ep.info&&ep.info.movie_image){const img=document.createElement('img');img.src=ep.info.movie_image;img.alt='';img.style.cssText='width:92px;height:58px;object-fit:cover;border-radius:5px';row.appendChild(img);}
      const details=document.createElement('div');details.className='series-episode-info';
      const name=document.createElement('strong');name.textContent=ep.title||ep.name||('Episodio '+(i+1));
      const small=document.createElement('small');small.textContent=ep.info&&ep.info.duration?ep.info.duration:'Episodio '+(ep.episode_num||i+1);
      details.append(name,small);
      const play=document.createElement('button');play.textContent='▶';play.setAttribute('aria-label','Reproducir episodio');play.addEventListener('click',()=>playEpisode(ep,name.textContent));
      row.append(details,play);list.appendChild(row);
    });
  }
  function playEpisode(ep,title) {
    const ext=String(ep.container_extension||'mp4').replace(/[^a-z0-9]/gi,'')||'mp4';
    const url=activeProfile.server.replace(/\/+$/,'')+'/series/'+encodeURIComponent(activeProfile.username)+'/'+encodeURIComponent(activeProfile.password)+'/'+encodeURIComponent(ep.id)+'.'+ext;
    stopEpisode();
    el('seriesPlayerTitle').textContent=title;
    el('seriesPlayer').classList.add('active');
    el('seriesPlayer').classList.remove('series-ui-hidden');
    const video=el('seriesVideo');
    if(/\.m3u8($|\?)/i.test(url)&&window.Hls&&Hls.isSupported()){
      seriesHls=new Hls({enableWorker:true});seriesHls.loadSource(url);seriesHls.attachMedia(video);
      seriesHls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)msg('No se pudo reproducir el episodio. Comprueba el formato y acceso del servidor.','error');});
    } else video.src=url;
    video.play().catch(()=>{});
    if(el('seriesPlayer').requestFullscreen) el('seriesPlayer').requestFullscreen().catch(()=>{});
  }
  function stopEpisode(){if(seriesHls){seriesHls.destroy();seriesHls=null;}const v=el('seriesVideo');v.pause();v.removeAttribute('src');v.load();}
  el('openSeriesButton').addEventListener('click',openSeries);
  el('seriesBackButton').addEventListener('click',()=>{el('seriesScreen').style.display='none';el('catalogScreen').style.display='block';});
  el('seriesDetailBack').addEventListener('click',()=>{el('seriesDetail').style.display='none';el('seriesGrid').style.display='grid';el('seriesCategoryList').style.display='flex';el('seriesSearch').style.display='block';filter();});
  el('seriesSearch').addEventListener('input',filter);
  el('seriesLoadMoreButton').addEventListener('click',()=>{state.visible+=30;renderCatalog();});
  // Barra nativa y controles propios se muestran y ocultan sincronizados.
  ['pointerdown','touchstart','mousemove','keydown'].forEach(evt=>{
    el('seriesPlayer').addEventListener(evt,showSeriesControls,{passive:true});
  });
  el('seriesVideo').addEventListener('play',showSeriesControls);
  el('seriesVideo').addEventListener('pause',()=>{clearTimeout(seriesUiTimer);el('seriesPlayer').classList.remove('series-ui-hidden');});
  el('seriesVideo').addEventListener('ended',()=>{clearTimeout(seriesUiTimer);el('seriesPlayer').classList.remove('series-ui-hidden');});
  el('seriesPlayerClose').addEventListener('click',async()=>{clearTimeout(seriesUiTimer);stopEpisode();el('seriesPlayer').classList.remove('active','series-ui-hidden');if(document.fullscreenElement)try{await document.exitFullscreen();}catch(_){}});
})();


// Pantalla y acciones de Favoritos
let currentFavoritesFilter='all';
function renderFavorites(){
  const grid=$('favoritesGrid');grid.replaceChildren();
  const all=PerciaFavorites.all().filter(x=>currentFavoritesFilter==='all'||x.type===currentFavoritesFilter);
  $('favoritesCount').textContent=all.length+' elementos';
  $('favoritesEmpty').style.display=all.length?'none':'block';
  all.forEach(entry=>{
    const item=entry.item||{}, type=entry.type;
    const wrap=document.createElement('div');wrap.className='favorite-card-wrap';
    const card=document.createElement('button');card.type='button';card.className='movie-card';card.style.cssText='width:100%;text-align:left;padding:0;color:inherit;background:#191919';
    const image=document.createElement('img');image.className='poster';image.loading='lazy';image.alt=item.name||'Favorito';
    image.src=item.stream_icon||item.cover||'';
    image.onerror=()=>{image.style.display='none';};
    const title=document.createElement('div');title.className='movie-name';title.textContent=item.name||'Elemento';
    card.append(image,title);
    card.addEventListener('click',()=>{
      $('favoritesScreen').style.display='none';
      if(type==='movie'){ $('catalogScreen').style.display='block'; showMovieDetail(item); }
      else if(type==='series'){ $('seriesScreen').style.display='block'; openSeriesDetails(item); }
      else if(type==='live'){ $('liveScreen').style.display='block'; playLiveChannel(item); }
    });
    wrap.append(card,PerciaFavorites.button(type,item));grid.appendChild(wrap);
  });
}
$('openFavoritesButton').addEventListener('click',()=>{
  $('catalogScreen').style.display='none';$('liveScreen').style.display='none';$('seriesScreen').style.display='none';
  $('favoritesScreen').style.display='block';currentFavoritesFilter='all';
  document.querySelectorAll('[data-fav-filter]').forEach(b=>b.classList.toggle('active',b.dataset.favFilter==='all'));
  renderFavorites();
});
$('favoritesBackButton').addEventListener('click',()=>{
  $('favoritesScreen').style.display='none';$('catalogScreen').style.display='block';
});
document.querySelectorAll('[data-fav-filter]').forEach(b=>b.addEventListener('click',()=>{
  currentFavoritesFilter=b.dataset.favFilter;
  document.querySelectorAll('[data-fav-filter]').forEach(x=>x.classList.toggle('active',x===b));
  renderFavorites();
}));
document.addEventListener('percia:favorites-changed',()=>{if($('favoritesScreen').style.display!=='none')renderFavorites();});

</script>
